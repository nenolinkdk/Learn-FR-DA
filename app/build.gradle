plugins {
    id "com.android.application"
}

def signingValue = { String name ->
    def envValue = System.getenv(name)
    if (envValue != null && !envValue.trim().isEmpty()) return envValue
    return project.findProperty(name)
}

def releaseKeystoreFile = signingValue("NENOLING_KEYSTORE_FILE")
def releaseKeystorePassword = signingValue("NENOLING_KEYSTORE_PASSWORD")
def releaseKeyAlias = signingValue("NENOLING_KEY_ALIAS")
def releaseKeyPassword = signingValue("NENOLING_KEY_PASSWORD")
def hasReleaseSigning = [releaseKeystoreFile, releaseKeystorePassword, releaseKeyAlias, releaseKeyPassword]
        .every { it != null && !it.toString().trim().isEmpty() }

android {
    namespace "dk.nenolink.learnfrda"
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "dk.nenolink.learnfrda"
        minSdk 23
        targetSdk 35
        versionCode 7
        versionName "0.5.2"
        buildConfigField "String", "RELEASE_DATE", "\"31.08.2026\""
    }

    if (hasReleaseSigning) {
        signingConfigs {
            release {
                storeFile file(releaseKeystoreFile)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    sourceSets {
        androidTest.assets.srcDir "../linguistic/testdata"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20240303"
}

def namedTestApkFileName = "Learn-FR-DA-${android.defaultConfig.versionName}-clean.apk"

tasks.register("copyDebugApkForManualTesting", Copy) {
    from(layout.buildDirectory.file("outputs/apk/debug/app-debug.apk"))
    into(layout.buildDirectory.dir("outputs/manual-debug"))
    rename { "Learn-FR-DA-debug.apk" }
}

tasks.register("copyNamedTestApkToDist", Copy) {
    from(layout.buildDirectory.file("outputs/apk/debug/app-debug.apk"))
    into(rootProject.layout.projectDirectory.dir("dist"))
    rename { namedTestApkFileName }
}

tasks.configureEach { task ->
    if (task.name == "assembleDebug") {
        task.finalizedBy("copyDebugApkForManualTesting", "copyNamedTestApkToDist")
    }
}
