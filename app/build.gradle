plugins {
    id "com.android.application"
}

android {
    namespace "dk.nenolink.learnfrda"
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "dk.nenolink.learnfrda.gate3test"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "0.5.0-gate3"
        buildConfigField "String", "RELEASE_DATE", "\"31.08.2026\""
    }

    sourceSets {
        androidTest.assets.srcDir "../linguistic/testdata"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(":engine")
    implementation project(":app-shell")
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20240303"
}

def namedTestApkFileName = "Learn-FR-DA-${android.defaultConfig.versionName}-test.apk"

tasks.register("copyDebugApkForManualTesting", Copy) {
    from(layout.buildDirectory.file("outputs/apk/debug/app-debug.apk"))
    into(layout.buildDirectory.dir("outputs/manual-debug"))
    rename { "Learn-FR-DA-debug.apk" }
}

tasks.register("copyNamedTestApkToDist", Copy) {
    from(layout.buildDirectory.file("outputs/apk/debug/app-debug.apk"))
    into(rootProject.layout.projectDirectory.dir("dist"))
    rename { namedTestApkFileName }
}

tasks.configureEach { task ->
    if (task.name == "assembleDebug") {
        task.finalizedBy("copyDebugApkForManualTesting", "copyNamedTestApkToDist")
    }
}
